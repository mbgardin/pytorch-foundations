[project]
name = "pytorch-foundations"
version = "0.1.0"
description = "A hands-on introduction to PyTorch for students of machine learning"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.5,<3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.5,<2",
    "jupyterlab>=4.2,<5",
    "ipykernel>=6.29,<7",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
